[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vodagg"
version = "0.1.0"
description = "Gather multi-perspective Twitch footage of Deadlock matches for editing."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "boon-deadlock>=0.11",
    "click>=8.1",
    "pillow>=10",
    "requests>=2.31",
    "yt-dlp>=2024.8.6",
    "zstandard>=0.22",
]

[project.optional-dependencies]
live = ["streamlink>=6.7"]
dev = ["pytest>=8"]

[project.scripts]
vodagg = "vodagg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
